<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habit Tracker</title>
<!-- FINAL PREVIEW: game intro + polished UI shell; original app is mounted after continue. -->
<style>
:root{--htx-bg:#0a0908;--htx-ink:#f3efe2;--htx-muted:#aaa394;--htx-faint:#6f6959;--htx-gold:#d9ae53;--htx-gold2:#f0d186;--htx-line:#37352a}
#htx-intro{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,rgba(217,174,83,.09),transparent 32%),radial-gradient(circle at 15% 85%,rgba(134,171,120,.08),transparent 25%),#0a0908;color:var(--htx-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;transition:opacity .85s cubic-bezier(.22,.8,.2,1),visibility .85s}
#htx-intro.htx-leave{opacity:0;visibility:hidden}
#htx-grid,#htx-scanlines{position:absolute;inset:0;pointer-events:none}
#htx-grid{opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,rgba(0,0,0,1),transparent 88%)}
#htx-scanlines{opacity:.05;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.85) 0 1px,transparent 1px 4px);mix-blend-mode:screen}
.htx-orb{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.22}
.htx-orb.a{width:32rem;height:32rem;background:var(--htx-gold);left:-12rem;top:-14rem;animation:htxOrbA 13s ease-in-out infinite}
.htx-orb.b{width:30rem;height:30rem;background:#86ab78;right:-15rem;top:4rem;animation:htxOrbB 16s ease-in-out infinite}
.htx-orb.c{width:27rem;height:27rem;background:#6a9ec4;left:15%;bottom:-22rem;animation:htxOrbC 18s ease-in-out infinite}
@keyframes htxOrbA{50%{transform:translate(6rem,5rem) scale(1.08)}}
@keyframes htxOrbB{50%{transform:translate(-5rem,3rem) scale(.9)}}
@keyframes htxOrbC{50%{transform:translate(3rem,-5rem) scale(1.12)}}
.htx-core{position:relative;z-index:2;width:min(780px,92vw);text-align:center;transform:translateY(-1vh)}
.htx-sigil{width:92px;height:92px;margin:0 auto 25px;position:relative;border-radius:28px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.1);box-shadow:0 0 70px rgba(217,174,83,.13),inset 0 1px 0 rgba(255,255,255,.07);animation:htxFloat 3.2s ease-in-out infinite}
.htx-sigil:before,.htx-sigil:after{content:"";position:absolute;border:1px solid rgba(217,174,83,.35);border-radius:30px}
.htx-sigil:before{inset:-9px;animation:htxSpin 10s linear infinite}
.htx-sigil:after{inset:-17px;opacity:.18;animation:htxSpin 14s linear infinite reverse}
.htx-sigil-core{width:28px;height:28px;border-radius:9px;transform:rotate(45deg);background:linear-gradient(145deg,var(--htx-gold2),#92733b);box-shadow:0 0 28px rgba(217,174,83,.45)}
@keyframes htxFloat{50%{transform:translateY(-7px)}}
@keyframes htxSpin{to{transform:rotate(360deg)}}
.htx-title{font-size:clamp(35px,8vw,68px);font-weight:900;letter-spacing:.15em;margin-left:.15em;line-height:1}
.htx-subtitle{color:var(--htx-muted);font-size:13px;letter-spacing:.16em;text-transform:uppercase;margin-top:11px}
.htx-status{margin:49px auto 12px;display:flex;justify-content:center;gap:9px;align-items:center;color:var(--htx-muted);font-size:12px;letter-spacing:.06em}
.htx-dot{width:7px;height:7px;border-radius:50%;background:var(--htx-gold);box-shadow:0 0 14px rgba(217,174,83,.55);animation:htxBlink 1s infinite}
@keyframes htxBlink{50%{opacity:.3}}
.htx-loader{width:min(560px,74vw);height:3px;margin:auto;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.02)}
.htx-fill{height:100%;width:0;background:linear-gradient(90deg,#6f5930,var(--htx-gold2));box-shadow:0 0 16px rgba(217,174,83,.6);transition:width .12s linear}
.htx-percent{font-variant-numeric:tabular-nums;color:var(--htx-faint);font-size:10px;margin-top:9px}
.htx-prompt{opacity:0;transform:translateY(10px);transition:.65s cubic-bezier(.2,.8,.2,1);pointer-events:none;margin-top:50px}
.htx-prompt.ready{opacity:1;transform:none;pointer-events:auto}
.htx-prompt-main{display:inline-flex;align-items:center;gap:9px;color:var(--htx-ink);font-size:13px;font-weight:850;letter-spacing:.13em;text-transform:uppercase}
.htx-key{display:inline-grid;place-items:center;min-width:29px;height:26px;padding:0 7px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.035);color:var(--htx-gold2);font-size:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.htx-prompt-hint{margin-top:12px;color:var(--htx-faint);font-size:10px;letter-spacing:.02em}
#htx-flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:2147483646}
#htx-flash.fire{animation:htxFlash .55s ease-out}
@keyframes htxFlash{0%{opacity:0}18%{opacity:.13}100%{opacity:0}}
.htx-reveal{animation:htxAppReveal 1s cubic-bezier(.2,.8,.2,1)}
@keyframes htxAppReveal{from{opacity:.25;transform:scale(1.018);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
#htx-error{display:none;position:relative;z-index:3;max-width:620px;margin:20px auto;padding:14px 16px;border:1px solid rgba(196,115,90,.35);border-radius:14px;background:rgba(196,115,90,.08);color:#e7c7bd;font:12px/1.5 Inter,system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){#htx-intro *{animation:none!important;transition:none!important}.htx-reveal{animation:none!important}}
</style>

<body>
<div id="htx-loading-fallback" style="display:none"></div>
<section id="htx-intro" aria-label="Habit Tracker loading screen">
  <div id="htx-grid"></div><div id="htx-scanlines"></div>
  <span class="htx-orb a"></span><span class="htx-orb b"></span><span class="htx-orb c"></span>
  <div class="htx-core">
    <div class="htx-sigil"><div class="htx-sigil-core"></div></div>
    <div class="htx-title">HABIT TRACKER</div>
    <div class="htx-subtitle">Track less · Live more</div>
    <div class="htx-status"><span class="htx-dot"></span><span id="htx-status-text">Initializing interface</span></div>
    <div class="htx-loader"><div id="htx-fill" class="htx-fill"></div></div>
    <div id="htx-percent" class="htx-percent">0%</div>
    <div id="htx-prompt" class="htx-prompt">
      <div class="htx-prompt-main">Press <span class="htx-key">ANY</span> button <span class="htx-key">↵</span></div>
      <div class="htx-prompt-hint">Click / tap anywhere or press Enter / Space</div>
    </div>
  </div>
  <div id="htx-error"></div>
</section>
<div id="htx-flash"></div>
<script>
(() => {
  const BASE = 'https://raw.githubusercontent.com/FateXVoid/Habit-Tracker/b179e37f3c330fac2b5adf4abb3f09624b6c5601/index.html';
  const intro = document.getElementById('htx-intro');
  const fill = document.getElementById('htx-fill');
  const percent = document.getElementById('htx-percent');
  const status = document.getElementById('htx-status-text');
  const prompt = document.getElementById('htx-prompt');
  const flash = document.getElementById('htx-flash');
  const errBox = document.getElementById('htx-error');
  let baseReady = false, ready = false, entering = false;
  let baseMarkup = '', baseTitle = 'Habit Tracker';

  const states = [
    [0, 'Initializing interface'],
    [18, 'Loading routines'],
    [38, 'Syncing daily data'],
    [60, 'Calibrating focus'],
    [78, 'Preparing your space'],
    [91, 'Verifying local storage'],
    [100, 'System ready']
  ];

  function labelFor(p){ let label=states[0][1]; for(const [at,t] of states) if(p>=at) label=t; return label; }

  async function loadBase(){
    try{
      const res = await fetch(BASE, {cache:'no-store'});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const text = await res.text();
      const doc = new DOMParser().parseFromString(text,'text/html');
      baseTitle = doc.title || baseTitle;
      baseMarkup = doc.body.innerHTML;
      const bodyAttrs = Array.from(doc.body.attributes);
      for(const a of bodyAttrs) document.body.setAttribute(a.name,a.value);

      // Load the original app head assets, without replacing this wrapper's CSS.
      for(const node of Array.from(doc.head.children)){
        if(node.tagName === 'META' || node.tagName === 'LINK' || node.tagName === 'STYLE'){
          const copy = node.cloneNode(true);
          if(node.tagName === 'STYLE') copy.setAttribute('data-htx-base-style','1');
          document.head.appendChild(copy);
        }
      }
      document.title = baseTitle;
      baseReady = true;
      return doc;
    }catch(e){
      baseReady = false;
      errBox.textContent = 'Base app could not be loaded from the current GitHub version. Check your internet connection, then refresh. ('+e.message+')';
      errBox.style.display = 'block';
      return null;
    }
  }

  async function mountBase(doc){
    if(!doc || !baseReady) return;
    // Mount the original body exactly as shipped, preserving its HTML/CSS/JS behavior.
    document.body.innerHTML = baseMarkup;
    for(const script of Array.from(doc.body.querySelectorAll('script'))){
      const s = document.createElement('script');
      for(const a of Array.from(script.attributes)) s.setAttribute(a.name,a.value);
      if(script.src){
        s.src = script.src;
        await new Promise(resolve => { s.onload=s.onerror=resolve; document.body.appendChild(s); });
      } else {
        s.textContent = script.textContent;
        document.body.appendChild(s);
      }
    }
  }

  const basePromise = loadBase();
  const start = performance.now();
  const duration = 2850;
  function tick(now){
    const t = Math.min((now-start)/duration,1);
    const eased = 1-Math.pow(1-t,3);
    let p = Math.round(eased*100);
    if(!baseReady) p = Math.min(p, 90);
    fill.style.width = p+'%';
    percent.textContent = p+'%';
    status.textContent = labelFor(p);
    if(t<1 || !baseReady) requestAnimationFrame(tick);
    else {
      ready=true;
      prompt.classList.add('ready');
      status.textContent='System ready';
    }
  }
  requestAnimationFrame(tick);


  function applyPolish(){
    if(document.body.classList.contains('htx-polished')) return;
    document.body.classList.add('htx-polished');

    var app = document.querySelector('.app');
    var top = app && app.querySelector('.topbar');
    var main = app && app.querySelector('main');
    if(!app || !top || !main) return;

    var ringWrap = top.querySelector('.ring-wrap');
    var eyebrow = top.querySelector('#eyebrow');
    var monthTitle = top.querySelector('#monthTitle');
    var dateSub = top.querySelector('#dateSub');
    var clockLine = top.querySelector('#clockLine');

    var hero = document.createElement('div');
    hero.className = 'htx-hero';

    var completion = document.createElement('section');
    completion.className = 'htx-ui-card htx-completion';
    completion.innerHTML =
      '<div class="htx-kicker">Today\\'s completion</div>'+
      '<div class="htx-score-row"><strong id="htx-score">0%</strong><span id="htx-count">0 / 0 habits</span></div>'+
      '<div id="htx-ring-slot"></div>'+
      '<div class="htx-mini-line"><span id="htx-left">0</span> habits still open today</div>';

    var focus = document.createElement('section');
    focus.className = 'htx-ui-card htx-focus';
    focus.innerHTML =
      '<div class="mark">“</div>'+
      '<p>Consistency beats intensity when nobody is watching.</p>'+
      '<small>Focus for today · <span id="htx-focus-left">0</span> habits still open</small>';

    hero.appendChild(completion);
    hero.appendChild(focus);

    var ringSlot = completion.querySelector('#htx-ring-slot');
    if(ringWrap) ringSlot.appendChild(ringWrap);

    top.innerHTML = '';
    if(eyebrow) top.appendChild(eyebrow);
    if(monthTitle){
      top.appendChild(monthTitle);
      monthTitle.style.display='none';
    }
    if(dateSub){
      top.appendChild(dateSub);
      dateSub.style.fontSize='12px';
      dateSub.style.color='var(--ink-dim)';
      dateSub.style.marginTop='2px';
    }
    if(clockLine){
      top.appendChild(clockLine);
      clockLine.style.marginTop='7px';
    }

    main.parentNode.insertBefore(hero, main);

    var score = completion.querySelector('#htx-score');
    var count = completion.querySelector('#htx-count');
    var left = completion.querySelector('#htx-left');
    var focusLeft = focus.querySelector('#htx-focus-left');

    function syncMini(){
      var done = document.getElementById('statDone');
      var goal = document.getElementById('statGoal');
      var leftEl = document.getElementById('statLeft');
      var pct = document.getElementById('ringPct');
      if(pct && score) score.textContent = pct.textContent || '0%';

      var d = done ? parseInt(done.textContent,10) : 0;
      var g = goal ? parseInt(goal.textContent,10) : 0;
      var l = leftEl ? parseInt(leftEl.textContent,10) : Math.max(g-d,0);

      if(count) count.textContent = d+' / '+g+' habits';
      if(left) left.textContent = isFinite(l) ? l : 0;
      if(focusLeft) focusLeft.textContent = isFinite(l) ? l : 0;
    }
    syncMini();
    setInterval(syncMini, 500);

    var todayView = document.getElementById('view-today');
    if(todayView){
      var firstCard = todayView.querySelector('.card');
      if(firstCard){
        var oldHead = firstCard.querySelector('.row-between');
        if(oldHead){
          oldHead.classList.add('htx-today-head');
          var h = oldHead.querySelector('h2');
          if(h) h.textContent = "Today's habits";
        }
      }
    }

    app.classList.add('htx-reveal');
  }

  async function enter(){
    if(!ready || entering || !baseReady) return;
    entering=true;
    document.removeEventListener('keydown',onKey);
    intro.removeEventListener('pointerdown',onPointer);
    flash.classList.add('fire');
    prompt.classList.remove('ready');

    // Put the original app back before revealing it.
    const doc = await basePromise;
    if(!doc) return;
    await mountBase(doc);
    applyPolish();
    const app = document.querySelector('.app');
    if(app){ app.style.opacity='0'; app.classList.add('htx-reveal'); requestAnimationFrame(()=>requestAnimationFrame(()=>app.style.opacity='')); }
    intro.classList.add('htx-leave');
    setTimeout(()=>intro.remove(),900);
  }
  function onKey(e){ if(e.code==='Enter'||e.code==='Space'||e.key.length===1){ e.preventDefault(); enter(); } }
  function onPointer(){ enter(); }
  document.addEventListener('keydown',onKey);
  intro.addEventListener('pointerdown',onPointer);
})();
</script>
</body>
</html>
